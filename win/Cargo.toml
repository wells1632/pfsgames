[package]
name = "win"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "cookies", "json"] }
scraper = "0.17"
chrono = "0.4"
rust_xlsxwriter = "0.6"
# GUI dependencies
iced = "0.12"
# Note: Iced 0.12 requires a compatible Rust toolchain (1.75+)
rfd = "0.14"


[[bin]]
name = "your_app_name"
path = "src/main.rs"

[package.metadata.winres]
# optional, for icon etc.
